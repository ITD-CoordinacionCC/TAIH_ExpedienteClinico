name: TAIH_PisoHospitalario

on:
  pull_request:
    branches:
      - develop

jobs:
  call_env:
    uses: ./.github/workflows/actionsvariables.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ./TAIH_PisoHospitalario.slnx

      - name: Compilar proyecto
        run: dotnet build ./TAIH_PisoHospitalario.slnx --configuration Release --no-restore