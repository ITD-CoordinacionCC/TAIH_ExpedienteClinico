name: TAIH_ExpedienteClinico_variables

on:
  workflow_call:

env:
  App_name: 'TAIH_ExpedienteClinico'
  Dotnet_Version: '10'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TipoEjecucion: 'Validacion de variables'

    steps:
      - name: Ejecutar checkout
        uses: actions/checkout@v4

      - name: Mostrar variables todas
        env:
          mensaje: Hola soy una variable
        run: |
          echo "Aplicacion: $App_name"
          echo "Version de framework: $Dotnet_Version"
          echo "Variable local: $TipoEjecucion"
          echo $mensaje

      - name: Usar Variable
        run: echo $framework

      - name: Variables del repositorio
        run: |
          echo ${{vars.PROYECT_DESCRIPTION}}
          echo $GITHUB_WORKSPACE

      - name: Reemplazar appsettings
        shell: pwsh
        run: |
          $path = "$env:GITHUB_WORKSPACE\TAIH_ExpedienteClinico\appsettings.json"

          $json = Get-Content $path -Raw | ConvertFrom-Json

          echo "antes..."
          echo $json

          $json.ConnectionStrings.default = "Prueba del cambio exitosa"

          $json | ConvertTo-Json -Depth 10 | Set-Content $path

          echo "despues..."
          echo $json